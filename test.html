<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天机阁-测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0a0a1a;color:#f0e6d3;padding:60px 20px 80px}
h1{color:#c9a96e;text-align:center;margin-bottom:30px}
button{display:block;width:100%;height:50px;margin-bottom:12px;font-size:16px;border:none;border-radius:10px;color:#fff;cursor:pointer;background:#c9a96e}
div{padding:16px;background:#1a1a3e;border-radius:10px;margin-bottom:12px;border:1px solid rgba(201,169,110,0.15)}
#msg{color:#c9a96e;text-align:center;margin-top:20px;font-size:18px;min-height:30px}
</style>
</head>
<body>
<h1>🔮 点击测试</h1>
<button onclick="document.getElementById('msg').textContent='按钮1被点击了！'">按钮1 - 点我</button>
<button onclick="document.getElementById('msg').textContent='按钮2被点击了！'">按钮2 - 点我</button>
<button onclick="document.getElementById('msg').textContent='按钮3被点击了！'">按钮3 - 点我</button>
<div onclick="document.getElementById('msg').textContent='DIV被点击了！'" style="cursor:pointer">这是一个可点击的DIV - 点我</div>
<div id="msg"></div>
<script>
document.body.addEventListener('click',function(e){
  console.log('CLICK:',e.target.tagName,e.target.textContent.substring(0,20));
});
</script>
</body>
</html>
